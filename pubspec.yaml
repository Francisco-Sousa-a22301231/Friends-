name: friends_app
description: "Track how long it's been since you talked to your friends and family."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Permissions
  permission_handler: ^11.3.0

  # Native communication logs
  call_log: ^4.0.0
  flutter_sms_inbox: ^1.0.4

  # Contacts
  flutter_contacts: ^1.1.7+1

  # Local storage
  sqflite: ^2.3.2
  path: ^1.9.0

  # Encryption
  encrypt: ^5.0.3

  # Date formatting
  intl: ^0.19.0
  timeago: ^3.6.1

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
